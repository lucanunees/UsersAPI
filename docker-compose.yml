services:
  postgres:
    image: postgres:16
    container_name: fcg-postgres2
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: fcg
      POSTGRES_PASSWORD: fcgpw
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcg -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pg_data:
