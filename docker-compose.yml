version: '3.8'

services:
  # ========================================
  # API Principal
  # ========================================
  users-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: users-api
    ports:
      - "5001:80"
    environment:
      # ASP.NET Core
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=postgres;Username=fcg;Password=fcgpw
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: users-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-fcg}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-fcgpw}
      - POSTGRES_DB=fcg_users_db
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  users-network:
    driver: bridge

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

volumes:
  pg_data:
